name: Validar Kotlin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Instalar compilador Kotlin 2.1.0
        run: |
          curl --fail --location --retry 2 -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          echo 'b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297  kotlin.zip' | sha256sum --check --strict
          unzip -q kotlin.zip -d /tmp/kotlin-tools
          /tmp/kotlin-tools/kotlinc/bin/kotlinc Main.kt -include-runtime -d app.jar
      - name: Testar regras de domínio
        run: java -jar app.jar --self-test

      - name: Testar CLI e compatibilidade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "documentos.tsv"
              path.write_text("titulo\tvalidade\nHoje\t2026-12-31\nLimite\t2027-01-07\nFora\t2027-01-08\n", encoding="utf-8")
              result = subprocess.run(["java","-jar","app.jar","--proximos","2026-12-31","7",str(path)],capture_output=True,text=True)
              assert result.returncode == 0, result.stderr
              assert result.stdout.splitlines() == ["titulo\tvalidade","Hoje\t2026-12-31","Limite\t2027-01-07"]
              legacy = subprocess.run(["java","-jar","app.jar","2026-12-31",str(path)],capture_output=True,text=True)
              assert legacy.returncode == 0 and "BEGIN:VCALENDAR" in legacy.stdout
              bad = subprocess.run(["java","-jar","app.jar","--proximos","2026-12-31","-1",str(path)],capture_output=True,text=True)
              assert bad.returncode == 2 and not bad.stdout
          print("3 cenários CLI OK")
          PY
